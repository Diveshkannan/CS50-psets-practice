<!DOCTYPE html>

<html lang="en">

    <head>
      
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>Personal Workspace</title>
        <script>
            document.addEventListener("DOMContentLoaded", () => {




                let details = localStorage.getItem("sharedData");
                let array = details.split(",");

                let name = document.querySelector("#name");
                let pass = document.querySelector("#password");

                let submit = document.querySelector(".submit");
                let limit = 0;

                submit.addEventListener("click", (e) => {
                    e.preventDefault();






                    let check = true;


                    if (limit > 5) {
                        alert("No more chances");
                        window.location.href = "error.html";

                    }
                    limit += 1;
                    if ((name.value).length == 0) {
                        name.style.backgroundColor = "red";
                        check = false;

                    }
                    else {
                        name.style.backgroundColor = "black";


                    }
                    if ((pass.value).length == 0) {
                        pass.style.backgroundColor = "red";
                        check=false;
                        alert("Enter your password");

                    }
                    else {
                        pass.style.backgroundColor = "black";

                    }

                    if (check) {
                        /*todo */
                        let con = true;
                        if ((name.value).toUpperCase() !== array[0].toUpperCase()) {
                            con = false;
                            name.style.backgroundColor="Red";

                        }
                        else{
                        name.style.backgroundColor="black";}


                        if (((pass.value).toUpperCase()) !== ((array[5].toString()).toUpperCase())){
                                 con=false;
                                 pass.style.backgroundColor="Red";

                             }
                             else
                             {
                                pass.style.backgroundColor="black";
                             }


                        if (con) {


                            sessionStorage.setItem("password",true);
                            window.location.href = "index.html";
                            alert("Successfully entered");
                        }
                        else {
                            alert("It's incorrect");

                        }


                    }
                    else {
                        alert("Enter all required data");

                    }


                });

            });

        </script>
    </head>

    <body>
        <div class="head">Pass this page</div>
        <div class="section">
            <form>
                <label for="name" class="input">Name - </label>
                <input type="text" autocomplete="off" id="name" name="name" required>
                <br>
                <br><br>
                <label for="password" class="input">Password - </label>
                <input type="text" autocomplete="off" name="password" id="password" required>
                <br>
                <br>
                <br>
                <br>

                <button type="button" class="submit">Submit</button>







            </form>


        </div>

    </body>

</html>
